repos:
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.10.1
    hooks:
      - id: betterleaks

  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true

      - id: build
        name: build
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true
